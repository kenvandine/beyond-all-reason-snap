name: beyond-all-reason
base: core24
title: Beyond All Reason
version: '0.16.2'
summary: Beyond All Reason - a free, open-source real-time strategy game
license: GPL-2.0-or-later
contact: https://github.com/kenvandine/beyonad-all-reason/issues
issues: https://github.com/kenvandine/beyonad-all-reason/issues
website: https://www.beyondallreason.info/
description: |
  Beyond All Reason (BAR) is a free and open-source, community-made
  real-time strategy game built on the Recoil (Spring RTS) engine, with
  original open assets. This snap packages the official BAR Lobby
  (Electron-based launcher/client), which handles logging in, matchmaking,
  and downloading/updating the Recoil engine and game content on first run
  and whenever new versions are published.

  Because the Recoil engine and BAR's maps/game content are updated
  frequently and independently of the lobby release cycle, packaging the
  official launcher (rather than freezing an engine/content version inside
  the snap) is the most maintainable approach, matching how the upstream
  project itself recommends distributing BAR.
grade: stable
confinement: strict
compression: lzo

platforms:
  amd64:

apps:
  beyond-all-reason:
    command: bar-lobby-wrapper
    extensions: [gnome]
    desktop: usr/share/applications/bar-lobby.desktop
    plugs:
      - opengl
      - wayland
      - x11
      - audio-playback
      - joystick
      - network
      - network-bind
      - home
      - removable-media
      - screen-inhibit-control
      - unity7
    environment:
      HOME: $SNAP_USER_COMMON

parts:
  bar-lobby:
    plugin: dump
    source: https://github.com/beyond-all-reason/bar-lobby/releases/download/v$SNAPCRAFT_PROJECT_VERSION/BeyondAllReason-$SNAPCRAFT_PROJECT_VERSION.AppImage
    source-type: file
    override-build: |
      chmod +x "$SNAPCRAFT_PART_SRC"/BeyondAllReason-*.AppImage
      "$SNAPCRAFT_PART_SRC"/BeyondAllReason-*.AppImage --appimage-extract
      cp -a squashfs-root/. "$SNAPCRAFT_PART_INSTALL"/
      # The AppImage's own squashfs preserves some dirs (e.g. resources/)
      # as 0700/root-only, which blocks the non-root snap process (uid
      # 1000) from reading app.asar etc. Make everything at least
      # world-readable/traversable.
      chmod -R a+rX "$SNAPCRAFT_PART_INSTALL"
      # electron-builder ships a setuid sandbox helper; strict-mode snaps
      # can't use setuid binaries, so run Chromium with --no-sandbox instead
      # (see the wrapper's exec line) and drop the now-unusable binary.
      rm -f "$SNAPCRAFT_PART_INSTALL"/chrome-sandbox
      # 1. electron-updater detects $SNAP and intentionally disables itself,
      # returning null from checkForUpdates() without emitting any events.
      # bar-lobby's AutoUpdaterAPI awaits those events in a Promise that never
      # resolves, hanging the Initial Setup wizard on "Downloading update".
      # Snaps are updated via snapd anyway, so disable the in-app auto-updater
      # by keeping AutoUpdaterAPI uninitialized (this.initialized = false).
      # 2. BAR Lobby hardcodes Fullscreen=0 as its default engine setting, which
      # causes Recoil/Spring to launch in a decorated/framed window under Wayland.
      # Default Fullscreen=1 instead so matches launch in fullscreen out-of-the-box.
      # Both replacements are byte-length identical so asar offsets remain valid.
      python3 -c "
      with open('$SNAPCRAFT_PART_INSTALL/resources/app.asar', 'rb+') as f:
          content = f.read()
          t1 = b'allowPrerelease=!1,this.initialized=!0'
          r1 = b'allowPrerelease=!1,this.initialized=!1'
          assert t1 in content, 'Auto-updater target not found in app.asar'
          content = content.replace(t1, r1, 1)

          t2 = b'ForceDisableShaders:0,Fullscreen:0,FullscreenEdgeMove:1'
          r2 = b'ForceDisableShaders:0,Fullscreen:1,FullscreenEdgeMove:1'
          assert t2 in content, 'Fullscreen default target not found in app.asar'
          content = content.replace(t2, r2, 1)

          f.seek(0)
          f.write(content)
      "
      # The AppImage only ships its .desktop file at the root; install it
      # under the standard FHS path and point Exec/Icon at the in-snap
      # wrapper/icon (the upstream file points at absolute host paths).
      mkdir -p "$SNAPCRAFT_PART_INSTALL"/usr/share/applications
      sed \
        -e 's|^Exec=.*|Exec=bar-lobby-wrapper %U|' \
        -e 's|^Icon=.*|Icon=${SNAP}/usr/share/icons/hicolor/512x512/apps/bar-lobby.png|' \
        "$SNAPCRAFT_PART_INSTALL"/bar-lobby.desktop \
        > "$SNAPCRAFT_PART_INSTALL"/usr/share/applications/bar-lobby.desktop
    build-packages:
      - python3
    stage-packages:
      - xkb-data
      - libnss3
      - libnspr4
      - libatk1.0-0t64
      - libatk-bridge2.0-0t64
      - libatspi2.0-0t64
      - libcups2t64
      - libdrm2
      - libgbm1
      - libxkbcommon0
      - libxcomposite1
      - libxdamage1
      - libxfixes3
      - libxrandr2
      - libpango-1.0-0
      - libasound2t64
      - libgtk-3-0t64
      - libsdl2-2.0-0
      - libopenal1

  wrapper:
    plugin: dump
    source: snap/local
    organize:
      bar-lobby-wrapper: bar-lobby-wrapper
    stage:
      - bar-lobby-wrapper
